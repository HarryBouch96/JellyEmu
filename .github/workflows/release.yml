name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Get version from csproj
        id: version
        run: |
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' JellyEmu.csproj | xargs)
          TARGET_ABI=$(sed -n 's/.*Include="Jellyfin.Controller" Version="\([^"]*\)".*/\1/p' JellyEmu.csproj | xargs).0
          if [ "v${VERSION}" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match csproj version ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TARGET_ABI=${TARGET_ABI}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --configuration Debug --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Zip release artifacts
        run: |
          jq '.version = "${{ steps.version.outputs.VERSION }}"' manifest.json > publish/manifest.json
          cd publish
          zip -j ../JellyEmu_${{ steps.version.outputs.VERSION }}.zip \
            JellyEmu.dll Scriban.dll manifest.json

      - name: Compute checksums
        id: checksum
        run: |
          echo "MD5=$(md5sum JellyEmu_${{ steps.version.outputs.VERSION }}.zip | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "SHA256=$(sha256sum JellyEmu_${{ steps.version.outputs.VERSION }}.zip | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: previoustag
        run: |
          PREV=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -n1)
          echo "PREV=${PREV}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Skip merges and the bot commits that update the plugin catalog.
          if [ -n "${{ steps.previoustag.outputs.PREV }}" ]; then
            LOG=$(git log ${{ steps.previoustag.outputs.PREV }}..${{ github.ref_name }} --pretty=format:"- %s" --no-merges --invert-grep --grep="update plugin catalog")
          else
            LOG=$(git log -n 20 --pretty=format:"- %s" --no-merges --invert-grep --grep="update plugin catalog")
          fi
          printf '%s\n' "$LOG" > changelog.md
          echo "LOG<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JellyEmu v${{ steps.version.outputs.VERSION }}
          body: |
            ## JellyEmu v${{ steps.version.outputs.VERSION }}

            ${{ steps.changelog.outputs.LOG }}

            ### Installation
            In Jellyfin, go to Dashboard → Plugins → Repositories and add:
            `https://raw.githubusercontent.com/${{ github.repository }}/main/repository.json`

            Or download `JellyEmu_${{ steps.version.outputs.VERSION }}.zip`, extract, and copy both DLLs to your Jellyfin plugins folder.

            **MD5:** `${{ steps.checksum.outputs.MD5 }}`
            **SHA256:** `${{ steps.checksum.outputs.SHA256 }}`
          files: JellyEmu_${{ steps.version.outputs.VERSION }}.zip

      - name: Update plugin catalog
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          TARGET_ABI: ${{ steps.version.outputs.TARGET_ABI }}
          CHECKSUM: ${{ steps.checksum.outputs.MD5 }}
          SOURCE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JellyEmu_${{ steps.version.outputs.VERSION }}.zip
        run: |
          git fetch origin main
          git checkout -B main origin/main
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Newest version first; replace any existing entry for this version (re-runs).
          jq --arg version "$VERSION" \
             --arg targetAbi "$TARGET_ABI" \
             --arg checksum "$CHECKSUM" \
             --arg sourceUrl "$SOURCE_URL" \
             --arg timestamp "$TIMESTAMP" \
             --rawfile changelog changelog.md \
             '.[0].versions = ([{version: $version, changelog: $changelog, targetAbi: $targetAbi, sourceUrl: $sourceUrl, checksum: $checksum, timestamp: $timestamp}]
               + [.[0].versions[] | select(.version != $version)])' \
             repository.json > repository.json.tmp
          mv repository.json.tmp repository.json
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add repository.json
          git commit -m "chore: update plugin catalog for v${VERSION}"
          git push origin main
